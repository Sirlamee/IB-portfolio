<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMEPAGE</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="transition-overlay"></div>

  <section class="main-container">

    <nav class="navbar">
      <div class="nav-brand">
        <a href="#" class="nav-brand-link">
          <img src="images/vectorrr.png" alt="Logo" class="dark-theme-logo">
          <img src="images/Vector.png" alt="Logo" class="light-theme-logo">
          <span>S--I</span>
        </a>
      </div>
      <div class="hamburger-menu">
        <div class="hamburger-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="nav-links">
        <a href="#" class="nav-link nav-link-active">Works</a>
        <a href="../ABOUT/index.html" class="nav-link">About</a>
        <a href="../CONTACT/index.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-toggle">
        <label class="theme-switch">
          <input type="checkbox" id="theme-toggle">
          <span class="theme-slider"></span>
        </label>
      </div>
    </nav>

    <!-- Play button (only visible on desktop) -->
    <div class="play-container" id="playContainer">
      <div class="rotating-text" id="rotatingText"></div>
      <div class="play-button">
        <div class="play-icon"></div>
      </div>
    </div>

    <!-- Video overlay -->
    <div class="video-overlay" id="videoOverlay">
      <div class="video-wrapper">
        <video class="inline-video" id="video" controls>
          <source src="images/hireMe.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>



    <div class="container">
      <!-- Column 1 (Active by default) -->
      <div class="column active" data-bg="column1" data-link="../UIUX/index.html">
        <video class="bg-video" muted loop playsinline>
          <source src="images/forUIUX.mp4" type="video/mp4">
        </video>
        <div class="column-heading">UI/UX</div>
        <div class="content">
          <div class="text-bottom">
            <h3 class="column-title">UI/UX</h3>
            <p>FIgma</p>
            <p>Adobe XD</p>
            <p>Framer</p>
          </div>
        </div>
      </div>

      <!-- Column 2 -->
      <div class="column" data-bg="column2" data-link="../2D%20MOTION%20DESIGN/index.html">
        <video class="bg-video" muted loop playsinline>
          <source src="images/for2D.mp4" type="video/mp4">
        </video>
        <div class="column-heading">2D Motion Design</div>
        <div class="content">
          <div class="text-bottom">
            <h3 class="column-title">2D Motion Design</h3>
            <p>Adobe illustrator</p>
            <p>After effect</p>
            <p>Adobe premier pro</p>
          </div>
        </div>
      </div>

      <!-- Column 3 -->
      <div class="column" data-bg="column3" data-link="../3D%20VISUALIZER/index.html">
        <video class="bg-video" muted loop playsinline>
          <source src="images/for3D.mp4" type="video/mp4">
        </video>
        <div class="column-heading">3D Visualizer</div>
        <div class="content">
          <div class="text-bottom">
            <h3 class="column-title">3D Visualizer</h3>
            <p>Adobe illustrator</p>
            <p>After effect</p>
            <p>Houdini</p>
          </div>
        </div>
      </div>

      <!-- Column 4 -->
      <div class="column" data-bg="column4" data-link="../PLAYGROUND/index.html">
        <video class="bg-video" muted loop playsinline>
          <source src="images/forPlayground.mp4" type="video/mp4">
        </video>
        <div class="column-heading">Playground</div>
        <div class="content">
          <div class="text-bottom">
            <h3 class="column-title">Playground</h3>
            <p>Adobe illustrator</p>
            <p>After effect</p>
            <p>Houdini</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Slideshow Navigation Arrows -->
    <button class="slideshow-arrow slideshow-prev" id="prevSlide">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
    <button class="slideshow-arrow slideshow-next" id="nextSlide">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

    <!-- Slide Indicators -->
    <div class="slideshow-indicators">
      <span class="indicator active" data-slide="0"></span>
      <span class="indicator" data-slide="1"></span>
      <span class="indicator" data-slide="2"></span>
      <span class="indicator" data-slide="3"></span>
    </div>


  </section>

  <script src="../themeToggle.js"></script>
  <script src="columnHoverrr.js"></script>
  <!-- <script src="columnClickable.js"></script> -->
  <script src="transitionClick.js"></script>
  <script src="../slideshowMobile.js"></script>
  <script src="rotatingPlayButton.js"></script>

</body>

</html>
