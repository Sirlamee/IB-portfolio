<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Button with Overlay Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Play button - only visible on mobile (max-width: 950px) */
    .play-container {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      display: none; /* Hidden by default */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease;
      z-index: 100;
    }

    @media (min-width: 951px) {
      .play-container {
        display: flex; /* Only show on desktop */
      }
    }

    .play-container:hover {
      transform: scale(1.05);
    }

    .play-container.hidden {
      display: none;
    }

    /* Rotating text */
    .rotating-text {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .rotating-text span {
      position: absolute;
      left: 50%;
      top: 0;
      transform-origin: 0 40px;
      font-size: 10px;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Play button */
    .play-button {
      position: relative;
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      z-index: 10;
      transition: all 0.3s ease;
    }

    .play-container:hover .play-button {
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-left: 20px solid #667eea;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      margin-left: 5px;
    }

    /* Video overlay */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-overlay.active {
      display: flex;
      opacity: 1;
    }

    .video-wrapper {
      position: relative;
      width: 80%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Mobile responsive adjustments */
    @media (max-width: 950px) {
      .video-wrapper {
        width: 90%;
        height: 50%;
      }
    }

    @media (max-width: 600px) {
      .video-wrapper {
        width: 95%;
        height: 40%;
      }
    }

    /* Demo content */
    .demo-content {
      text-align: center;
      color: white;
      padding: 40px;
    }

    .demo-content h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .demo-content p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    @media (max-width: 950px) {
      .demo-content h1 {
        font-size: 2rem;
      }

      .demo-content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Demo content -->
  <div class="demo-content">
    <h1>Play Button Demo</h1>
    <p>The play button appears in the top-right corner on mobile devices (screens ≤ 950px)</p>
    <p style="margin-top: 10px;">Click it to play the video overlay</p>
  </div>

  <!-- Play button (only visible on desktop) -->
  <div class="play-container" id="playContainer">
    <div class="rotating-text" id="rotatingText"></div>
    <div class="play-button">
      <div class="play-icon"></div>
    </div>
  </div>

  <!-- Video overlay -->
  <div class="video-overlay" id="videoOverlay">
    <div class="video-wrapper">
      <video id="video" controls>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script>
    // Create rotating text
    const text = "CLICK PLAY ICON TO WATCH MY VIDEO • ";
    const rotatingTextContainer = document.getElementById('rotatingText');
    const totalChars = text.length;
    
    for (let i = 0; i < totalChars; i++) {
      const span = document.createElement('span');
      span.textContent = text[i];
      const rotation = (360 / totalChars) * i;
      span.style.transform = `rotate(${rotation}deg)`;
      rotatingTextContainer.appendChild(span);
    }

    // Video functionality
    const playContainer = document.getElementById('playContainer');
    const videoOverlay = document.getElementById('videoOverlay');
    const video = document.getElementById('video');

    // Open video overlay when play button is clicked
    playContainer.addEventListener('click', () => {
      videoOverlay.classList.add('active');
      playContainer.classList.add('hidden');
      video.play();
    });

    // Close video when clicking outside the video
    videoOverlay.addEventListener('click', (e) => {
      if (e.target === videoOverlay) {
        closeVideo();
      }
    });

    // Close video function
    function closeVideo() {
      videoOverlay.classList.remove('active');
      playContainer.classList.remove('hidden');
      video.pause();
      video.currentTime = 0;
    }

    // Close on ESC key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && videoOverlay.classList.contains('active')) {
        closeVideo();
      }
    });

    // Optional: Close when video ends
    video.addEventListener('ended', () => {
      closeVideo();
    });
  </script>
</body>
</html>
